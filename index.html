<style>
:root{
  /* Smartland brand, pushed for contrast */
  --ink:#242223;          /* near-black charcoal (hero/dark bands) */
  --charcoal:#4A4547;     /* brand charcoal */
  --lime:#BEC831;         /* brand lime: primary CTA on dark */
  --lime-d:#A3AC1E;
  --olive:#737145;        /* brand olive */
  --olive-d:#4E4C2C;
  --terra:#B45437;        /* brand terracotta: CTA on light / accents */
  --terra-d:#8F3F26;
  --cream:#FAF8F1;
  --sand:#F3EDD6;
  --white:#fff;
  --muted:#6B6668;
  --radius:18px;
  --shadow:0 10px 30px rgba(36,34,35,.14);
  --head:'Fredoka',system-ui,sans-serif;
  --body:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:var(--body);color:var(--charcoal);background:var(--cream);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:70px}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.15;color:var(--ink)}
h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:600}
h3{font-size:1.25rem;font-weight:600}
.eyebrow{display:inline-block;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:10px}
.on-dark .eyebrow{color:var(--lime)}
.sec{padding:78px 0}
.sec-head{text-align:center;max-width:720px;margin:0 auto 46px}
.sec-head p{color:var(--muted);margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:700;font-size:1rem;text-decoration:none;border-radius:999px;padding:15px 28px;border:2px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;line-height:1.1}
.btn:hover{transform:translateY(-2px)}
.btn-lime{background:var(--lime);color:var(--ink);box-shadow:0 6px 0 var(--lime-d)}
.btn-lime:hover{box-shadow:0 8px 0 var(--lime-d)}
.btn-terra{background:var(--terra);color:#fff;box-shadow:0 6px 0 var(--terra-d)}
.btn-terra:hover{box-shadow:0 8px 0 var(--terra-d)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-ghost:hover{background:#fff;color:var(--ink)}
.btn-ghost-dark{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost-dark:hover{background:var(--ink);color:#fff}
.btn-block{width:100%}
.ico{width:1.15em;height:1.15em;flex:none;fill:currentColor}

/* Announcement + header */
.announce{background:var(--lime);color:var(--ink);text-align:center;font-weight:700;font-size:.85rem;letter-spacing:.03em;padding:9px 14px}
.announce b{text-transform:uppercase}
header.top{background:var(--ink);position:sticky;top:0;z-index:50;border-bottom:3px solid var(--lime)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
header.top img{height:40px;width:auto}
.hdr-right{display:flex;align-items:center;gap:16px}
.hdr-badge{color:#fff;font-size:.8rem;font-weight:500;opacity:.9;display:none}
.hdr-badge b{color:var(--lime)}
.hdr-call{padding:11px 20px;font-size:.95rem;box-shadow:none}


/* Thank-you hero */
body{background:var(--ink)}
.ty-hero{background:var(--ink);color:#fff;text-align:center;padding:64px 0 74px;min-height:calc(100vh - 71px);display:grid;align-items:center}
.ty-hero .tick{width:84px;height:84px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;margin:0 auto 22px;font-size:2.6rem;font-weight:700;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.ty-hero h1{color:#fff;font-size:clamp(2rem,5vw,3.1rem);font-weight:600}
.ty-hero h1 em{font-style:normal;color:var(--lime)}
.ty-hero .sub{max-width:620px;margin:16px auto 0;color:#E4DFD9;font-size:1.05rem}
.ty-hero .sub strong{color:#fff}
.ty-cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}
.ty-cta .btn{white-space:nowrap}
.ty-svc{display:none;margin-top:18px;font-size:.9rem;color:#BDB7B1}
.ty-svc b{color:var(--lime)}

body{padding-bottom:0}
@media(max-width:520px){.ty-cta .btn{width:100%}}
@media(min-width:980px){.hdr-badge{display:block}.ty-hero{padding:84px 0 96px}}
</style>
</head>
<body>

  // Page shown after a successful form submit. Leave blank to show the inline thank-you message instead.
  thankYouUrl:   "thank-you.html",
  conversionLabel: "port_macquarie"   // used in dataLayer events so GTM can fire per-centre conversion actions
};
</script>


<header class="top">
  <div class="wrap">
    <a href="https://www.smartland.com.au/" aria-label="Smartland Boutique Early Learning">
      <img src="https://www.smartland.com.au/wp-content/uploads/2021/07/smartlandwhite2-1.png" alt="Smartland Boutique Early Learning" width="150" height="46">
    </a>
    <div class="hdr-right">
      <span class="hdr-badge"><b>NQS: Exceeding</b> · CCS approved</span>
      <a class="btn btn-lime hdr-call" data-sl-tel data-evt="call_thankyou_header" href="#">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
        <span data-sl="phoneDisplay"></span>
      </a>
    </div>
  </div>

<!-- THANK YOU -->
<section class="ty-hero">
  <div class="wrap">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Thank you, <em>we've got your request!</em></h1>
    <p class="sub">The <strong><span data-sl="centre"></span></strong> team will call you <strong>within one business day</strong> to lock in a time for your tour or Stay &amp; Play.</p>
    <p class="ty-svc" id="tySvc">You asked about: <b id="tySvcName"></b></p>
    <div class="ty-cta">
      <a class="btn btn-lime" href="https://www.smartland.com.au/" data-evt="cta_homepage_thankyou">Go to Homepage →</a>
    </div>
  </div>
</section>


<script>
(function(){
  var C = window.SL, q = function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};

  /* 1. Fill per-location text */
  q('[data-sl]').forEach(function(el){ el.textContent = C[el.getAttribute('data-sl')] || ''; });
  q('[data-sl-tel]').forEach(function(el){ el.href = 'tel:' + C.phoneTel; });
  q('[data-sl-href]').forEach(function(el){ el.href = C[el.getAttribute('data-sl-href')]; });
  document.title = 'Thank You | Smartland ' + C.centre;

  /* 2. Fire the lead conversion ONCE per real submission.
        The landing page sets the sl_lead flag on a successful submit; a refresh or a direct visit won't fire it again. */
  window.dataLayer = window.dataLayer || [];
  var lead = null;
  try{ lead = JSON.parse(sessionStorage.getItem('sl_lead') || 'null'); sessionStorage.removeItem('sl_lead'); }catch(e){}
  if(lead){
    dataLayer.push({event:'ppc_form_submit', centre:C.centre, conversion_label:C.conversionLabel, service:lead.service || ''});
    if(lead.service){ document.getElementById('tySvcName').textContent = lead.service; document.getElementById('tySvc').style.display = 'block'; }
  }

  /* 3. dataLayer events (call + CTA clicks) */
  q('[data-evt]').forEach(function(el){
    el.addEventListener('click', function(){
      var e = el.getAttribute('data-evt');
      dataLayer.push({event: e.indexOf('call_')===0 ? 'ppc_call_click' : 'ppc_cta_click', cta_id: e, centre: C.centre, conversion_label: C.conversionLabel});
    });
  });
})();
</script>
